<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. SYSTEM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>J.A.R.V.I.S. MOBILE EDITION</h1>
        
        <div class="ring-container">
            <div class="ring ring-outer"></div>
            <div class="ring ring-middle"></div>
            <div class="ring ring-inner"></div>
            <div class="core"></div>
        </div>

        <div class="status-container">
            <div id="status-text" class="status-text ACTIVE">
                <span class="label">SYSTEM STATUS:</span>
                <span class="value">INITIALIZING CORE...</span>
            </div>
            <div id="voice-text" class="status-text">
                <span class="label">VOICE:</span>
                <span id="voice-status">OFFLINE</span>
            </div>
            <div id="memory-text" class="status-text">
                <span class="label">MEMORY:</span>
                <span id="memory-status">STANDBY</span>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ask J.A.R.V.I.S....">
            <button id="send-btn">SEND</button>
            <button id="voice-btn" class="mic-btn">MIC</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
